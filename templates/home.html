<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FWI Prediction</title>
    <style>
        body {
            background-image: url("https://wallpapers.com/images/hd/lush-green-forest-neblzag5t76yolal.jpg");
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
        }
        .very-low {
            background-color: #4CAF50; /* Green */
            color: white;
        }
        .low {
            background-color: #8BC34A; /* Light Green */
            color: white;
        }
        .moderate {
            background-color: #FFC107; /* Yellow */
            color: black;
        }
        .high {
            background-color: #FF9800; /* Orange */
            color: white;
        }
        .very-high {
            background-color: #F44336; /* Red */
            color: white;
        }
        .extreme {
            background-color: #B71C1C; /* Dark Red */
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>The FWI prediction is <span id="fwiValue">{{ result }}</span></h1>
        <p id="fireChance" class="{{ fire_risk_class }}">{{ fire_risk }}</p>
    </div>
</body>
</html>
